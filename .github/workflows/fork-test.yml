# Fork only: runs the upstream CI's checks on any branch or commit, on demand,
# to get native Windows results for a change before it is proposed.
name: Fork test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1
